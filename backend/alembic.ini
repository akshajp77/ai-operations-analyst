# Alembic configuration.
#
# Note what is NOT here: sqlalchemy.url. The connection string is a secret and
# is resolved at runtime in env.py from the same Settings object the
# application uses. Committing a database URL to this file is one of the most
# common ways credentials reach a public repository.

[alembic]
script_location = app/db/migrations

# Filename template. The date prefix means `ls versions/` shows migrations in
# the order they were authored, which is what you want when reconstructing
# what shipped when. The revision hash keeps names unique.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Interpret timestamps in the filename above as UTC, so a team spread across
# timezones produces a consistently ordered migration history.
timezone = UTC

prepend_sys_path = .

# Run the formatter over generated migrations so autogenerated files pass the
# same lint gate as hand-written code and do not fail CI on import order.
[post_write_hooks]
hooks = ruff_format ruff_fix

ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME


# Alembic's own logging. The application's structlog pipeline is not installed
# for CLI runs, so a plain configuration is used here.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
